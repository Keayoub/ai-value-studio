name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - name: Install PDF system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b fonts-liberation
      - name: Install backend dependencies
        run: |
          uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python -e ".[dev,backend]" -r backend/requirements.txt
      - name: Lint backend and framework
        run: .venv/bin/ruff check .
      - name: Run Python tests
        run: .venv/bin/pytest -q
      - name: Audit backend dependencies
        run: .venv/bin/python -m pip_audit -r backend/requirements.txt

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NEXT_PUBLIC_AUTH_MODE: entra
      NEXT_PUBLIC_API_BASE_URL: https://api.example.com/api/v1
      NEXT_PUBLIC_ENTRA_CLIENT_ID: 00000000-0000-0000-0000-000000000000
      NEXT_PUBLIC_ENTRA_TENANT_ID: common
      NEXT_PUBLIC_API_SCOPE: api://avs-api/access_as_user
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci
      - name: Typecheck web app
        run: npm run typecheck
      - name: Lint web app
        run: npm run lint
      - name: Build web app
        run: npm run build
      - name: Audit runtime web dependencies
        run: npm audit --audit-level=high --omit=dev

  electron:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            electron-app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - name: Install backend dependencies
        run: |
          uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python -e ".[dev,backend]" -r backend/requirements.txt
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Build dev renderer for Electron smoke
        working-directory: web
        env:
          NEXT_PUBLIC_AUTH_MODE: dev
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8010/api/v1
        run: npm run build
      - name: Install Electron dependencies
        working-directory: electron-app
        run: npm ci
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb
      - name: Typecheck Electron app
        working-directory: electron-app
        run: npm run typecheck
      - name: Lint Electron app
        working-directory: electron-app
        run: npm run lint
      - name: Run Electron unit tests
        working-directory: electron-app
        run: npm run test:unit
      - name: Package Electron app
        working-directory: electron-app
        run: npm run pack
      - name: Configure packaged Chromium sandbox
        working-directory: electron-app
        run: |
          set -eu
          sandbox_path="release/linux-unpacked/chrome-sandbox"
          sudo chown root:root "$sandbox_path"
          sudo chmod 4755 "$sandbox_path"
          stat --format '%n %U:%G %a %A' "$sandbox_path"
          test "$(stat --format '%U:%G' "$sandbox_path")" = "root:root"
          test "$(stat --format '%a' "$sandbox_path")" = "4755"
          test -u "$sandbox_path"
      - name: Run Electron smoke test
        working-directory: electron-app
        run: npm run test:smoke
      - name: Build production Entra renderer
        working-directory: web
        env:
          NEXT_PUBLIC_AUTH_MODE: entra
          NEXT_PUBLIC_API_BASE_URL: https://api.example.com/api/v1
          NEXT_PUBLIC_ENTRA_CLIENT_ID: 00000000-0000-0000-0000-000000000000
          NEXT_PUBLIC_ENTRA_TENANT_ID: common
          NEXT_PUBLIC_API_SCOPE: api://avs-api/access_as_user
        run: npm run build
      - name: Package Electron app against production renderer
        working-directory: electron-app
        run: npm run pack

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - name: Install backend dependencies
        working-directory: .
        run: |
          uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python -e ".[dev,backend]" -r backend/requirements.txt
      - name: Install PDF system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b fonts-liberation
      - name: Install web dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build static export
        run: npm run build
      - name: Run Playwright e2e
        run: npm run test:e2e

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check forbidden tracked artifacts
        run: |
          set -eu
          forbidden="$(
            git ls-files |
              grep -E '(^|/)(\.env($|\..+$)|[^/]+\.db$|[^/]+\.sqlite[^/]*$|server\.(out|err)$|[^/]+\.orig$|[^/]+\.backup[^/]*$|node_modules/|out/)' |
              grep -Ev '(^|/)\.env\.example$' || true
          )"
          if [ -n "$forbidden" ]; then
            printf 'Forbidden tracked artifacts found:\n%s\n' "$forbidden"
            exit 1
          fi
      - name: Run simple secret scan
        run: |
          set -eu
          if git grep -IlE '(AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{20,}|-----BEGIN (EC|RSA|OPENSSH|DSA|PGP) PRIVATE KEY-----)' -- \
            ':(glob)**/*.py' \
            ':(glob)**/*.ts' \
            ':(glob)**/*.tsx' \
            ':(glob)**/*.js' \
            ':(glob)**/*.jsx' \
            ':(glob)**/*.json' \
            ':(glob)**/*.md' \
            ':(glob)**/*.toml' \
            ':(glob)**/*.yml' \
            ':(glob)**/*.yaml' \
            ':(glob)**/.env*'; then
            echo "Potential secrets detected."
            exit 1
          fi
