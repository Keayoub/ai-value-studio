version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    # PR #20 deferral table: https://github.com/Keayoub/ai-value-studio/pull/20
    # defers WeasyPrint v70 because Pilot Charter pagination drops from 7 to 6 pages;
    # keep >=66,<67 until template-layout revalidation is complete.
    ignore:
      - dependency-name: "weasyprint"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    # PR #20 deferral table: https://github.com/Keayoub/ai-value-studio/pull/20
    # defers ESLint 10 until eslint-plugin-import, eslint-plugin-jsx-a11y,
    # and eslint-plugin-react add ESLint 10 peer support.
    ignore:
      - dependency-name: "eslint"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "npm"
    directory: "/electron-app"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
