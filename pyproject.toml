[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-value-studio-framework"
version = "0.1.0"
description = "Core framework engine for TIFINIA AI Value Studio"
readme = "README.md"
requires-python = ">=3.11,<3.12"

[project.optional-dependencies]
backend = [
    "anthropic>=0.57,<1",
    "jinja2>=3.1,<4",
    "openai>=1.54,<2",
    "weasyprint>=66,<67",
]
dev = [
    "httpx>=0.27,<0.28",
    "pip-audit>=2.8,<3",
    "pymupdf>=1.24,<2",
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<2",
    "pytest-cov>=5,<7",
    "ruff>=0.7,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
pythonpath = [".", "src", "backend"]
markers = [
    "live: opt-in tests that call external LLM providers",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"backend/services/kickstart.py" = ["E501", "I001"]
"backend/services/kickstart_langchain.py" = ["E501", "I001"]
"backend/services/kickstart_service.py" = ["E501", "I001"]
"backend/alembic/env.py" = ["E402"]
"backend/alembic/versions/*.py" = ["E501", "I001", "INP001"]
"backend/legacy/*.py" = ["E501", "I001"]
"tests/*.py" = ["S101"]
"backend/tests/*.py" = ["S101", "S603", "S607"]
